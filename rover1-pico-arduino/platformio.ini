; DEMETER Rover1 Pico W Arduino — PlatformIO (easy reproducible build, pins locked)
; Toolchain: pio run --target upload ; monitor @ 115200

[env:rpipicow]
platform = raspberrypi
board = rpipicow
framework = arduino
monitor_speed = 115200
monitor_filters = time
board_build.core = earlephilhower
lib_deps =
  adafruit/DHT sensor library@1.4.6
  adafruit/Adafruit Unified Sensor@1.1.14
  adafruit/Adafruit MPU6050@2.2.6
  adafruit/Adafruit BusIO@1.17.0
build_flags =
  -D PICO_CYW43_ARCH_THREADSAFE_BACKGROUND=1
  -D CYW43_LWIP=1
  ; AP SSID/PASS can be overridden at build: -DAP_SSID=\"MYAP\"
